apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scoring-api-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/rate-limit-burst: "20"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-ruleset: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRequestBodyAccess On
      SecRule REQUEST_HEADERS:Content-Type "text/xml" "id:101,phase:1,t:lowercase,deny,status:415,msg:'Unsupported media type'"
      SecRule ARGS "@contains <script>" "id:102,phase:2,t:lowercase,deny,status:403,msg:'XSS Attack Detected'"
      SecRule ARGS "@contains UNION SELECT" "id:103,phase:2,t:lowercase,deny,status:403,msg:'SQL Injection Detected'"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - scoring-api.company.com
    - api.company.com
    secretName: scoring-api-tls-secret
  rules:
  - host: scoring-api.company.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8000
  - host: api.company.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8000
---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: default
type: Opaque
data:
  auth: <base64-encoded-htpasswd>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-modsecurity-config
  namespace: ingress-nginx
data:
  modsecurity.conf: |
    Include /etc/nginx/owasp-modsecurity-crs/nginx-modsecurity.conf
    Include /etc/nginx/modsecurity.d/main.conf
    SecRuleEngine On
    SecRequestBodyAccess On
    SecRequestBodyLimit 13107200
    SecRequestBodyNoFilesLimit 131072
    SecRequestBodyLimitAction Reject
    SecPcreMatchLimit 1000
    SecPcreMatchLimitRecursion 1000
    SecResponseBodyAccess On
    SecResponseBodyMimeType text/plain text/html text/xml
    SecResponseBodyLimit 524288
    SecResponseBodyLimitAction ProcessPartial
    SecTmpDir /tmp/
    SecDataDir /tmp/
    SecUploadDir /tmp/
    SecUploadKeepFiles Off
    SecAuditEngine RelevantOnly
    SecAuditLog /var/log/modsec_audit.log
    SecAuditLogParts ABIJDEFHZ
    SecAuditLogType Serial
    SecAuditLogStorageDir /var/log/modsec/
    SecDebugLog /var/log/modsec_debug.log
    SecDebugLogLevel 0
    SecCollectionTimeout 600
    SecUnicodeMapFile unicode.mapping 20127
  main.conf: |
    SecAction \
      "id:900001,\
      phase:1,\
      nolog,\
      pass,\
      t:none,\
      setvar:tx.paranoia_level=2"
    SecAction \
      "id:900002,\
      phase:1,\
      nolog,\
      pass,\
      t:none,\
      setvar:tx.crs_validate_utf8_encoding=1"
    SecAction \
      "id:900003,\
      phase:1,\
      nolog,\
      pass,\
      t:none,\
      setvar:tx.arg_name_length=100"
    SecAction \
      "id:900004,\
      phase:1,\
      nolog,\
      pass,\
      t:none,\
      setvar:tx.arg_length=400"
    SecAction \
      "id:900005,\
      phase:1,\
      nolog,\
      pass,\
      t:none,\
      setvar:tx.total_arg_length=64000"
    SecAction \
      "id:900006,\
      phase:1,\
      nolog,\
      pass,\
      t:none,\
      setvar:tx.max_num_args=255"
    SecAction \
      "id:900007,\
      phase:1,\
      nolog,\
      pass,\
      t:none,\
      setvar:tx.combined_file_sizes=65535"
    SecAction \
      "id:900008,\
      phase:1,\
      nolog,\
      pass,\
      t:none,\
      setvar:tx.max_file_size=1048576"
    SecAction \
      "id:900009,\
      phase:1,\
      nolog,\
      pass,\
      t:none,\
      setvar:tx.inbound_anomaly_score_threshold=5"
    SecAction \
      "id:900010,\
      phase:1,\
      nolog,\
      pass,\
      t:none,\
      setvar:tx.outbound_anomaly_score_threshold=4"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "50"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/rate-limit-burst: "10"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: dashboard-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Dashboard Authentication Required'
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-ruleset: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'";
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - dashboard.company.com
    - monitoring.company.com
    secretName: dashboard-tls-secret
  rules:
  - host: dashboard.company.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashboard-service
            port:
              number: 80
  - host: monitoring.company.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-auth
  namespace: default
type: Opaque
data:
  auth: <base64-encoded-dashboard-htpasswd>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rate-limit-config
  namespace: ingress-nginx
data:
  rate-limit.lua: |
    local limit_req = require "resty.limit.req"
    local lim, err = limit_req.new("my_limit_req_store", 100, 20)
    if not lim then
        ngx.log(ngx.ERR, "failed to instantiate a resty.limit.req object: ", err)
        return ngx.exit(500)
    end

    local key = ngx.var.binary_remote_addr
    local delay, err = lim:incoming(key, true)
    if not delay then
        if err == "rejected" then
            return ngx.exit(429)
        end
        ngx.log(ngx.ERR, "failed to limit req: ", err)
        return ngx.exit(500)
    end

    if delay > 0 then
        ngx.sleep(delay / 1000)
    end
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-waf
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway-waf
  template:
    metadata:
      labels:
        app: api-gateway-waf
    spec:
      containers:
      - name: waf
        image: owasp/modsecurity-crs:nginx
        ports:
        - containerPort: 80
        env:
        - name: PARANOIA
          value: "2"
        - name: ANOMALY_INBOUND
          value: "5"
        - name: ANOMALY_OUTBOUND
          value: "4"
        - name: BACKEND
          value: "http://api-gateway:8000"
        volumeMounts:
        - name: modsecurity-config
          mountPath: /etc/modsecurity.d/
      volumes:
      - name: modsecurity-config
        configMap:
          name: nginx-modsecurity-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-waf
  namespace: default
spec:
  selector:
    app: api-gateway-waf
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-waf-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/rate-limit-burst: "50"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-ruleset: "true"
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "unique-id-%{UNIQUE_ID}"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - scoring-api.company.com
    - api.company.com
    secretName: scoring-api-tls-secret
  rules:
  - host: scoring-api.company.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-waf
            port:
              number: 80
  - host: api.company.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-waf
            port:
              number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: waf-custom-rules
  namespace: default
data:
  custom-rules.conf: |
    # Custom WAF Rules for Scoring API
    SecRule REQUEST_URI "@streq /score" "id:1001,phase:1,t:none,nolog,pass,setvar:tx.scoring_request=1"
    SecRule TX:scoring_request "@eq 1" "id:1002,phase:2,t:none,chain"
      SecRule ARGS_POST "model_version" "@rx ^v\d+\.\d+\.\d+$" "t:none,nolog,pass"
      SecRule ARGS_POST "model_version" "!@rx ^v\d+\.\d+\.\d+$" "t:none,deny,status:400,msg:'Invalid model version format'"

    SecRule REQUEST_URI "@streq /score" "id:1003,phase:2,t:none,chain"
      SecRule ARGS_POST:features "@validateByteRange 0-255" "t:none,nolog,pass"
      SecRule ARGS_POST:features "!@validateByteRange 0-255" "t:none,deny,status:400,msg:'Invalid feature data'"

    SecRule REQUEST_URI "@streq /score" "id:1004,phase:2,t:none,chain"
      SecRule &ARGS_POST:features "@lt 1000" "t:none,nolog,pass"
      SecRule &ARGS_POST:features "!@lt 1000" "t:none,deny,status:413,msg:'Too many features'"

    # Rate limiting per user
    SecAction "id:1005,phase:1,t:none,nolog,pass,initcol:ip=%{REMOTE_ADDR},setvar:ip.rate_limit=0"
    SecAction "id:1006,phase:1,t:none,nolog,pass,setvar:ip.rate_limit=+1,expirevar:ip.rate_limit=60"
    SecRule IP:RATE_LIMIT "@gt 100" "id:1007,phase:1,t:none,deny,status:429,msg:'Rate limit exceeded'"

    # Block suspicious patterns
    SecRule ARGS "@contains ../" "id:1008,phase:2,t:urlDecodeUni,deny,status:403,msg:'Path traversal attempt'"
    SecRule ARGS "@contains ../../" "id:1009,phase:2,t:urlDecodeUni,deny,status:403,msg:'Path traversal attempt'"
    SecRule ARGS "@contains %2e%2e%2f" "id:1010,phase:2,t:none,deny,status:403,msg:'Path traversal attempt'"

    # Block common attack patterns
    SecRule ARGS "@rx <(script|iframe|object|embed)" "id:1011,phase:2,t:lowercase,deny,status:403,msg:'XSS attempt'"
    SecRule ARGS "@rx (select|union|insert|update|delete|drop|create|alter)\s+" "id:1012,phase:2,t:lowercase,deny,status:403,msg:'SQL injection attempt'"
    SecRule ARGS "@rx (eval|exec|system|shell_exec|passthru|proc_open|popen)" "id:1013,phase:2,t:lowercase,deny,status:403,msg:'Code injection attempt'"

    # API-specific validations
    SecRule REQUEST_URI "@streq /score" "id:1014,phase:1,t:none,chain"
      SecRule REQUEST_HEADERS:Content-Type "!@streq application/json" "t:none,deny,status:415,msg:'Content-Type must be application/json'"

    SecRule REQUEST_URI "@streq /score" "id:1015,phase:1,t:none,chain"
      SecRule REQUEST_METHOD "!@streq POST" "t:none,deny,status:405,msg:'Method not allowed'"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: geo-blocking-config
  namespace: default
data:
  geo-blocking.lua: |
    local geo = require "resty.maxminddb"
    if not geo then
        ngx.log(ngx.ERR, "failed to load maxminddb")
        return
    end

    local res, err = geo.lookup(ngx.var.remote_addr)
    if not res then
        ngx.log(ngx.ERR, "failed to lookup geoip: ", err)
        return
    end

    -- Block countries if needed
    local blocked_countries = {"CU", "IR", "KP", "SY"}
    for _, country in ipairs(blocked_countries) do
        if res.country.iso_code == country then
            ngx.log(ngx.WARN, "Blocked request from blocked country: ", country)
            return ngx.exit(403)
        end
    end

    -- Allow specific countries only for sensitive endpoints
    if ngx.var.request_uri == "/admin" then
        local allowed_countries = {"FR", "DE", "US", "GB"}
        local allowed = false
        for _, country in ipairs(allowed_countries) do
            if res.country.iso_code == country then
                allowed = true
                break
            end
        end
        if not allowed then
            ngx.log(ngx.WARN, "Blocked admin access from non-allowed country: ", res.country.iso_code)
            return ngx.exit(403)
        end
    end
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geo-blocking-sidecar
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geo-blocking-sidecar
  template:
    metadata:
      labels:
        app: geo-blocking-sidecar
    spec:
      containers:
      - name: geo-blocker
        image: openresty/openresty:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: geo-config
          mountPath: /usr/local/openresty/nginx/conf/
        - name: geo-db
          mountPath: /usr/share/GeoIP/
      volumes:
      - name: geo-config
        configMap:
          name: geo-blocking-config
      - name: geo-db
        configMap:
          name: maxmind-geo-db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: maxmind-geo-db
  namespace: default
binaryData:
  GeoLite2-Country.mmdb: <base64-encoded-maxmind-db>