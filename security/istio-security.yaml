apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  namespace: istio-system
  name: istiod
spec:
  profile: default
  components:
    pilot:
      k8s:
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
    ingressGateways:
    - name: istio-ingressgateway
      enabled: true
      k8s:
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        service:
          type: LoadBalancer
          ports:
          - name: status-port
            port: 15021
            targetPort: 15021
          - name: http2
            port: 80
            targetPort: 8080
          - name: https
            port: 443
            targetPort: 8443
          - name: tls
            port: 15443
            targetPort: 15443
    egressGateways:
    - name: istio-egressgateway
      enabled: true
      k8s:
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
  values:
    global:
      proxy:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 2000m
            memory: 1024Mi
      mtls:
        enabled: true
      controlPlaneSecurityEnabled: true
      disablePolicyChecks: false
      imagePullPolicy: IfNotPresent
    pilot:
      autoscaleEnabled: true
      autoscaleMin: 2
      autoscaleMax: 5
    gateways:
      istio-ingressgateway:
        autoscaleEnabled: true
        autoscaleMin: 2
        autoscaleMax: 5
    security:
      selfSigned: false
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: default
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: kafka-mtls
  namespace: kafka
spec:
  selector:
    matchLabels:
      app: kafka
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: database-mtls
  namespace: default
spec:
  selector:
    matchLabels:
      app: postgresql
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: scoring-api-jwt
  namespace: default
spec:
  selector:
    matchLabels:
      app: scoring-api
  jwtRules:
  - issuer: "https://keycloak.company.com/auth/realms/scoring"
    jwksUri: "https://keycloak.company.com/auth/realms/scoring/protocol/openid-connect/certs"
    forwardOriginalToken: true
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: scoring-api-authz
  namespace: default
spec:
  selector:
    matchLabels:
      app: scoring-api
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/default/sa/api-gateway-sa"]
    to:
    - operation:
        methods: ["POST"]
        paths: ["/score"]
    when:
    - key: request.auth.claims[role]
      values: ["user", "admin"]
  - from:
    - source:
        principals: ["cluster.local/ns/default/sa/mlflow-sa"]
    to:
    - operation:
        methods: ["GET"]
        paths: ["/health", "/metrics"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: database-authz
  namespace: default
spec:
  selector:
    matchLabels:
      app: postgresql
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/default/sa/scoring-api-sa"]
    to:
    - operation:
        ports: ["5432"]
  - from:
    - source:
        principals: ["cluster.local/ns/default/sa/mlflow-sa"]
    to:
    - operation:
        ports: ["5432"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: kafka-authz
  namespace: kafka
spec:
  selector:
    matchLabels:
      app: kafka
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/default/sa/scoring-api-sa"]
    to:
    - operation:
        ports: ["9092"]
  - from:
    - source:
        principals: ["cluster.local/ns/default/sa/spark-sa"]
    to:
    - operation:
        ports: ["9092"]
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: scoring-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: scoring-api-tls-secret
    hosts:
    - scoring-api.company.com
    - api.company.com
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - scoring-api.company.com
    - api.company.com
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: scoring-api-routing
  namespace: default
spec:
  hosts:
  - scoring-api.company.com
  - api.company.com
  gateways:
  - scoring-gateway
  http:
  - match:
    - uri:
        prefix: "/score"
    route:
    - destination:
        host: scoring-api
        port:
          number: 8000
  - match:
    - uri:
        prefix: "/health"
    route:
    - destination:
        host: scoring-api
        port:
          number: 8000
  - match:
    - uri:
        prefix: "/metrics"
    route:
    - destination:
        host: scoring-api
        port:
          number: 8000
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: scoring-api-dr
  namespace: default
spec:
  host: scoring-api
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 10
        http2MaxRequests: 100
        maxRequestsPerConnection: 10
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: database-dr
  namespace: default
spec:
  host: postgresql
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 10s
      http:
        http1MaxPendingRequests: 5
        maxRequestsPerConnection: 5
        maxRetries: 2
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: kafka-dr
  namespace: kafka
spec:
  host: kafka
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 5s
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-apis
  namespace: default
spec:
  hosts:
  - api.external-service.com
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  resolution: DNS
  endpoints:
  - address: api.external-service.com
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: external-api-routing
  namespace: default
spec:
  hosts:
  - api.external-service.com
  http:
  - route:
    - destination:
        host: api.external-service.com
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: egress-external-authz
  namespace: default
spec:
  action: ALLOW
  rules:
  - to:
    - operation:
        hosts: ["api.external-service.com"]
    from:
    - source:
        principals: ["cluster.local/ns/default/sa/scoring-api-sa"]
---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: default
spec:
  tracing:
  - providers:
    - name: "jaeger"
    randomSamplingPercentage: 10.00
  metrics:
  - providers:
    - name: "prometheus"
    overrides:
    - match:
        metric: REQUEST_COUNT
        mode: CLIENT_AND_SERVER
      tagOverrides:
        request_operation:
          value: "istio_operationId"
    - match:
        metric: REQUEST_DURATION
        mode: CLIENT_AND_SERVER
      tagOverrides:
        response_code:
          value: "istio_responseCode"
  accessLogging:
  - providers:
    - name: "envoy"
    filter:
      expression: "response.code >= 400"
---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: scoring-api-telemetry
  namespace: default
spec:
  selector:
    matchLabels:
      app: scoring-api
  tracing:
  - providers:
    - name: "jaeger"
    randomSamplingPercentage: 50.00
    customTags:
      api_version:
        literal:
          value: "v1"
      user_id:
        header:
          name: "X-User-ID"
  metrics:
  - providers:
    - name: "prometheus"
    overrides:
    - match:
        metric: REQUEST_COUNT
        mode: CLIENT_AND_SERVER
      tagOverrides:
        scoring_model:
          value: "istio_header"
          key: "X-Model-Version"
  accessLogging:
  - providers:
    - name: "envoy"
    filter:
      expression: "true"