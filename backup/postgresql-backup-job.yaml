apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-backup-cron
  namespace: storage
spec:
  schedule: "0 */6 * * *"  # Toutes les 6 heures
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: postgresql-backup
            image: postgres:15-alpine
            command:
            - /bin/sh
            - -c
            - |
              # Configuration
              BACKUP_DIR="/backup"
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_NAME="scoring_db_${TIMESTAMP}.sql.gz"
              RETENTION_DAYS=7

              echo "🚀 Starting PostgreSQL backup: $BACKUP_NAME"

              # Créer le répertoire de sauvegarde
              mkdir -p $BACKUP_DIR

              # Dump de la base de données avec compression
              echo "📦 Creating database dump..."
              pg_dumpall -h postgresql.storage.svc.cluster.local \
                        -U postgres \
                        -p 5432 \
                        --clean \
                        --if-exists \
                        --no-password \
                        --compress=9 \
                        --file=$BACKUP_DIR/$BACKUP_NAME

              # Vérifier que la sauvegarde a réussi
              if [ $? -eq 0 ] && [ -f "$BACKUP_DIR/$BACKUP_NAME" ]; then
                BACKUP_SIZE=$(du -h $BACKUP_DIR/$BACKUP_NAME | cut -f1)
                echo "✅ Backup created successfully: $BACKUP_SIZE"

                # Calculer le checksum
                CHECKSUM=$(sha256sum $BACKUP_DIR/$BACKUP_NAME | cut -d' ' -f1)
                echo "$CHECKSUM  $BACKUP_NAME" > $BACKUP_DIR/${BACKUP_NAME}.sha256

                # Nettoyer les anciennes sauvegardes
                echo "🧹 Cleaning old backups (retention: ${RETENTION_DAYS} days)..."
                find $BACKUP_DIR -name "scoring_db_*.sql.gz" -mtime +$RETENTION_DAYS -delete
                find $BACKUP_DIR -name "scoring_db_*.sha256" -mtime +$RETENTION_DAYS -delete

                # Lister les sauvegardes restantes
                echo "📋 Current backups:"
                ls -la $BACKUP_DIR/scoring_db_*.sql.gz | head -10

                # Métriques pour Prometheus
                echo "# HELP postgresql_backup_success Backup success status" > /tmp/postgresql_backup.prom
                echo "# TYPE postgresql_backup_success gauge" >> /tmp/postgresql_backup.prom
                echo "postgresql_backup_success 1" >> /tmp/postgresql_backup.prom
                echo "# HELP postgresql_backup_size_bytes Backup file size in bytes" >> /tmp/postgresql_backup.prom
                echo "# TYPE postgresql_backup_size_bytes gauge" >> /tmp/postgresql_backup.prom
                echo "postgresql_backup_size_bytes $(stat -f%z $BACKUP_DIR/$BACKUP_NAME 2>/dev/null || stat -c%s $BACKUP_DIR/$BACKUP_NAME)" >> /tmp/postgresql_backup.prom

                echo "✅ PostgreSQL backup completed successfully"
              else
                echo "❌ PostgreSQL backup failed"
                exit 1
              fi
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: password
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-pvc
          restartPolicy: OnFailure
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard