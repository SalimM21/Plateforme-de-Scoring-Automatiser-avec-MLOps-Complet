name: CI/CD Pipeline - MLOps Scoring Platform

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===== TESTS ET QUALITÉ =====
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api-integration/requirements.txt
        pip install -r scoring-credit/requirements.txt
        pip install pytest pytest-cov black flake8 mypy bandit safety

    - name: Code formatting check (Black)
      run: |
        black --check --diff api-integration/ scoring-credit/ monitoring/ feature-store/

    - name: Linting (Flake8)
      run: |
        flake8 api-integration/ scoring-credit/ monitoring/ feature-store/ --max-line-length=120 --extend-ignore=E203,W503

    - name: Type checking (MyPy)
      run: |
        mypy api-integration/app/ scoring-credit/src/ --ignore-missing-imports

    - name: Security scanning (Bandit)
      run: |
        bandit -r api-integration/ scoring-credit/ -f json -o security-report.json || true
        if [ -f security-report.json ]; then
          echo "Security issues found:"
          cat security-report.json | jq '.results | length'
        fi

    - name: Dependency vulnerability check (Safety)
      run: |
        safety check --output json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          security-report.json

  # ===== TESTS UNITAIRES =====
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api-integration/requirements.txt
        pip install -r scoring-credit/requirements.txt
        pip install pytest pytest-cov pytest-mock pytest-asyncio

    - name: Run API tests
      run: |
        cd api-integration
        pytest app/tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379

    - name: Run ML tests
      run: |
        cd scoring-credit
        pytest src/tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

    - name: Run Feature Store tests
      run: |
        cd feature-store
        python -c "
        from feature_store import customer, customer_features, transaction_features
        print('Feature Store imports OK')
        print(f'Customer entity: {customer.name}')
        print(f'Customer features: {len(customer_features.schema)} fields')
        print(f'Transaction features: {len(transaction_features.schema)} fields')
        "

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: |
          api-integration/coverage.xml
          scoring-credit/coverage.xml

  # ===== TESTS D'INTÉGRATION =====
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build test containers
      run: |
        docker build -t scoring-api:test ./api-integration
        docker build -t mlflow-test:test ./scoring-credit

    - name: Run integration tests
      run: |
        # Démarrer les services de test
        docker run -d --name scoring-api -p 8000:8000 scoring-api:test
        docker run -d --name mlflow -p 5000:5000 mlflow-test:test

        # Attendre que les services soient prêts
        sleep 30

        # Tests d'intégration
        python -c "
        import requests
        import time

        # Test API Scoring
        try:
            response = requests.get('http://localhost:8000/health')
            assert response.status_code == 200
            print('API Scoring health check OK')
        except:
            print('API Scoring not responding')

        # Test MLflow
        try:
            response = requests.get('http://localhost:5000/health')
            print('MLflow health check OK')
        except:
            print('MLflow health check failed (normal si pas configuré)')
        "

  # ===== CONSTRUCTION DES IMAGES =====
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [quality-checks, unit-tests]
    strategy:
      matrix:
        service: [scoring-api, mlflow-server, feast-server, monitoring]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push ${{ matrix.service }}
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service == 'scoring-api' && 'api-integration' || matrix.service == 'mlflow-server' && 'scoring-credit' || matrix.service == 'feast-server' && 'feature-store' || 'monitoring' }}
        file: ./${{ matrix.service == 'scoring-api' && 'api-integration' || matrix.service == 'mlflow-server' && 'scoring-credit' || matrix.service == 'feast-server' && 'feature-store' || 'monitoring' }}/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ===== DÉPLOIEMENT =====
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images, integration-tests]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

    - name: Deploy to staging
      run: |
        # Mise à jour des images dans les manifests
        sed -i 's|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/scoring-api:develop|' api-integration/scoring-api-deployment.yaml
        sed -i 's|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mlflow-server:develop|' scoring-credit/mlflow-deployment.yaml

        # Déploiement
        kubectl apply -f k8s/staging/

        # Attendre le déploiement
        kubectl wait --for=condition=available --timeout=600s deployment/scoring-api deployment/mlflow-server

        # Tests de santé post-déploiement
        kubectl run test-pod --image=curlimages/curl --rm -i --restart=Never -- curl -f http://scoring-api-service/health

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

    - name: Deploy to production
      run: |
        # Mise à jour des images avec le tag de commit
        IMAGE_TAG=${GITHUB_SHA::8}
        sed -i "s|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/scoring-api:${IMAGE_TAG}|" api-integration/scoring-api-deployment.yaml
        sed -i "s|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mlflow-server:${IMAGE_TAG}|" scoring-credit/mlflow-deployment.yaml

        # Déploiement progressif
        kubectl apply -f k8s/production/

        # Rollout progressif
        kubectl rollout restart deployment/scoring-api
        kubectl rollout restart deployment/mlflow-server

        # Attendre le déploiement
        kubectl wait --for=condition=available --timeout=600s deployment/scoring-api deployment/mlflow-server

        # Tests de santé
        kubectl run test-pod --image=curlimages/curl --rm -i --restart=Never -- curl -f http://scoring-api-service/health

  # ===== SÉCURITÉ =====
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-images
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # ===== MONITORING =====
  update-monitoring:
    name: Update Monitoring
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Update Grafana dashboards
      run: |
        # Mise à jour des dashboards Grafana avec les nouvelles métriques
        echo "Mise à jour des dashboards de monitoring..."

    - name: Update Prometheus rules
      run: |
        # Mise à jour des règles d'alerte basées sur les nouveaux déploiements
        echo "Mise à jour des règles Prometheus..."

  # ===== RAPPORT FINAL =====
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [quality-checks, unit-tests, integration-tests, build-images, security-scan]
    if: always()
    steps:
    - name: Generate pipeline report
      run: |
        echo "# CI/CD Pipeline Report" >> pipeline-report.md
        echo "" >> pipeline-report.md
        echo "## Status Summary" >> pipeline-report.md
        echo "- Quality Checks: ${{ needs.quality-checks.result }}" >> pipeline-report.md
        echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> pipeline-report.md
        echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> pipeline-report.md
        echo "- Build Images: ${{ needs.build-images.result }}" >> pipeline-report.md
        echo "- Security Scan: ${{ needs.security-scan.result }}" >> pipeline-report.md
        echo "" >> pipeline-report.md
        echo "## Artifacts" >> pipeline-report.md
        echo "- Coverage Reports: Available in artifacts" >> pipeline-report.md
        echo "- Security Reports: Available in artifacts" >> pipeline-report.md
        echo "- Docker Images: Pushed to GHCR" >> pipeline-report.md
        echo "" >> pipeline-report.md
        echo "## Metrics" >> pipeline-report.md
        echo "- Build Time: ~N/A (to be calculated)" >> pipeline-report.md
        echo "- Test Coverage: Available in coverage reports" >> pipeline-report.md

    - name: Upload pipeline report
      uses: actions/upload-artifact@v3
      with:
        name: pipeline-report
        path: pipeline-report.md

    - name: Pipeline status notification
      if: failure()
      run: |
        echo "Pipeline failed - Check the logs for details"
        # Ici on pourrait ajouter une notification Slack/Teams
