apiVersion: v2
name: mlops-scoring-platform
description: A Helm chart for MLOps Scoring Platform with complete ML pipeline
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - mlops
  - machine-learning
  - scoring
  - kafka
  - spark
  - monitoring
home: https://github.com/company/mlops-scoring-platform
sources:
  - https://github.com/company/mlops-scoring-platform
maintainers:
  - name: MLOps Team
    email: mlops@company.com
dependencies:
  - name: postgresql
    version: "12.1.6"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "17.3.17"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: kafka
    version: "19.2.4"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
  - name: minio
    version: "12.6.7"
    repository: "https://charts.bitnami.com/bitnami"
    condition: minio.enabled
  - name: prometheus
    version: "19.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
  - name: grafana
    version: "6.50.7"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled
  - name: loki
    version: "3.3.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: loki.enabled
  - name: promtail
    version: "6.7.4"
    repository: "https://grafana.github.io/helm-charts"
    condition: promtail.enabled
  - name: ingress-nginx
    version: "4.5.2"
    repository: "https://kubernetes.github.io/ingress-nginx"
    condition: ingress-nginx.enabled